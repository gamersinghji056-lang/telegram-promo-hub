name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "android/**"
      - "capacitor.config.*"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0 --activate
          npm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare public APK asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk telegram-promotion-latest.apk
          node - <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const apk = fs.readFileSync("telegram-promotion-latest.apk");
          fs.writeFileSync("android-release.json", `${JSON.stringify({
            versionName: "0.1.0",
            versionCode: 1,
            channel: "Android Beta / Debug Test Build",
            apkFileName: "telegram-promotion-latest.apk",
            apkUrl: "/downloads/telegram-promotion-latest.apk",
            apkSizeBytes: apk.length,
            apkSha256: crypto.createHash("sha256").update(apk).digest("hex"),
            buildSha: process.env.GITHUB_SHA,
            buildDate: new Date().toISOString(),
          }, null, 2)}\n`);
          NODE

      - name: Publish public APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: telegram-promotion-android-beta
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Telegram Promotion Android Beta" --notes "Latest debug APK for Telegram Promotion Android testing."
          gh release upload "$RELEASE_TAG" telegram-promotion-latest.apk android-release.json --clobber

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: telegram-promotion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 10

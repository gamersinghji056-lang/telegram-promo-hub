name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed production APK/AAB using Android signing secrets"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "android/**"
      - "capacitor.config.*"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0 --activate
          npm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare public APK asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk telegram-promotion-latest.apk
          node - <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const apk = fs.readFileSync("telegram-promotion-latest.apk");
          fs.writeFileSync("android-release.json", `${JSON.stringify({
            versionName: "0.1.0",
            versionCode: 1,
            channel: "Android Beta / Debug Test Build",
            apkFileName: "telegram-promotion-latest.apk",
            apkUrl: "/downloads/telegram-promotion-latest.apk",
            apkSizeBytes: apk.length,
            apkSha256: crypto.createHash("sha256").update(apk).digest("hex"),
            buildSha: process.env.GITHUB_SHA,
            buildDate: new Date().toISOString(),
          }, null, 2)}\n`);
          NODE

      - name: Publish public APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: telegram-promotion-android-beta
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Telegram Promotion Android Beta" --notes "Latest debug APK for Telegram Promotion Android testing."
          gh release upload "$RELEASE_TAG" telegram-promotion-latest.apk android-release.json --clobber

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: telegram-promotion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 10

  build-signed-release:
    name: Build signed release APK and AAB
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0 --activate
          npm --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mark8bot-release.jks
          chmod 600 android/app/mark8bot-release.jks

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: mark8bot-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify signed release artifacts
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare production APK asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk telegram-promotion-latest.apk
          node - <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const apk = fs.readFileSync("telegram-promotion-latest.apk");
          fs.writeFileSync("android-release.json", `${JSON.stringify({
            versionName: "0.1.0",
            versionCode: 1,
            channel: "Production Release",
            apkFileName: "telegram-promotion-latest.apk",
            apkUrl: "/downloads/telegram-promotion-latest.apk",
            apkSizeBytes: apk.length,
            apkSha256: crypto.createHash("sha256").update(apk).digest("hex"),
            buildSha: process.env.GITHUB_SHA,
            buildDate: new Date().toISOString(),
          }, null, 2)}\n`);
          NODE

      - name: Publish production APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: telegram-promotion-android-production
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Telegram Promotion Android Production" --notes "Latest signed production APK for Telegram Promotion Android."
          gh release upload "$RELEASE_TAG" telegram-promotion-latest.apk android-release.json --clobber

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: telegram-promotion-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Delete decoded release keystore
        if: ${{ always() }}
        run: rm -f android/app/mark8bot-release.jks
